<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <rect width="300" height="220" fill="#F4FBF4"/>
  <!-- Desktop Tower -->
  <rect x="50" y="30" width="80" height="150" rx="8" fill="#1B4332" stroke="#2E7D32" stroke-width="3"/>
  <rect x="60" y="45" width="60" height="15" rx="3" fill="#37474F"/>
  <circle cx="90" cy="85" r="10" fill="#43A047"/>
  <circle cx="90" cy="130" r="18" fill="none" stroke="#66BB6A" stroke-width="3"/>
  <path d="M 90 120 L 90 140 M 80 130 L 100 130" stroke="#66BB6A" stroke-width="2"/>

  <!-- Monitor Screen -->
  <rect x="150" y="45" width="120" height="90" rx="6" fill="#2E7D32"/>
